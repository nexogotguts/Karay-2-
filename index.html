<!DOCTYPE html>
<html>
<head>
  <title>Karay Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f4f9; }
    header { background: #111; color: white; padding: 20px; text-align: center; }
    .container { padding: 15px; max-width: 600px; margin: auto; }
    .card { background: white; padding: 15px; margin-top: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    button { background: #28a745; color: white; border: none; padding: 12px 18px; border-radius: 6px; font-size: 16px; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Karay Marketplace</h1>
    <p>Buy & Sell Directly From Independent Sellers</p>
  </header>
  <div class="container">
    <div class="card">
      <h3>Wireless Headphones</h3>
      <p>Sold by: <strong>TechStore UK</strong></p>
      <p><strong>£29.99</strong></p>
      <button onclick="alert('Added to your Karay cart!')">Buy Now</button>
    </div>
  </div>
</body>
</html>
