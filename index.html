<!DOCTYPE html>
<html lang="en">
<head>
  <title>Karay — Acquire fast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0e14;
      color: #f1f5f9;
      line-height: 1.6;
    }
    .banner {
      background: linear-gradient(135deg, #0d131d 0%, #131b29 100%);
      border-bottom: 1px solid #1e293b;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }
    .banner img {
      max-width: 210px;
      width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
    }
    .banner-tagline {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
      letter-spacing: 0.4px;
    }
    .container {
      padding: 24px 16px;
      max-width: 640px;
      margin: auto;
    }
    .card {
      background-color: #161c28;
      border: 1px solid #263042;
      padding: 22px;
      margin-top: 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .card h3 {
      font-size: 19px;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .seller {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .seller strong {
      color: #cbd5e1;
    }
    .price {
      font-size: 22px;
      font-weight: 700;
      color: #34d399;
      margin-bottom: 16px;
    }
    button {
      background-color: #10b981;
      color: #052e16;
      font-weight: 700;
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
    }
    button:active {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <header class="banner">
    <img src="image_88990569.jpg" alt="Karay — Acquire fast">
    <p class="banner-tagline">Buy &amp; Sell Directly From Independent Sellers</p>
  </header>

  <div class="container">
    <div class="card">
      <h3>Wireless Headphones</h3>
      <p class="seller">Sold by: <strong>TechStore UK</strong></p>
      <p class="price">£29.99</p>
      <button onclick="alert('Added to your Karay cart!')">Buy Now</button>
    </div>
  </div>
</body>
</html>
